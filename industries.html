<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://novaracx.com/ecommerce.html">
  <title>E-commerce &amp; D2C Demos | Novara CX</title>
  <script>
    const target = new URL('ecommerce.html', location.href);
    target.search = location.search;
    target.hash = location.hash;
    const industry = target.searchParams.get('industry');
    target.searchParams.delete('industry');
    if (industry && !['ecommerce', 'e-commerce', 'd2c'].includes(industry)) {
      target.searchParams.delete('case');
      target.searchParams.delete('mode');
    }
    location.replace(target.href);
  </script>
  <noscript><meta http-equiv="refresh" content="0;url=ecommerce.html"></noscript>
</head>
