name: Deduplicate Novara additional agent pricing note

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/novara-agent-counter-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hide legacy duplicate pricing note
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('index.html'); t=p.read_text(encoding='utf-8'); m='NOVARA_DEDUP_NOTE_V4'; ins='<style id=\"novara-dedup-note-v4\">.additional-agent-price{display:none!important}</style><!-- '+m+' -->'; p.write_text(t if m in t else t.replace('</body>',ins+'</body>',1),encoding='utf-8')"
      - name: Commit index change
        shell: bash
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Remove duplicate additional agent pricing note"
            git push origin main
          fi
