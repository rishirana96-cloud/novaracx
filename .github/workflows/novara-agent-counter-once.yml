name: Apply Novara pricing cleanup

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/novara-agent-counter-once.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "novara-pricing-cleanup"
  cancel-in-progress: false

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove complete coverage badge
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '<span class="pricing-summary-badge">Complete coverage</span>'

          if old not in text:
              print('Complete coverage badge already absent.')
          else:
              text = text.replace(old, '', 1)
              path.write_text(text, encoding='utf-8')
              print('Removed Complete coverage badge.')
          PY

      - name: Commit patched index
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No index change to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Remove complete coverage badge"
            git push origin main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload patched site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy patched site
        uses: actions/deploy-pages@v5
