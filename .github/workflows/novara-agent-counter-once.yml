name: Fix Novara additional agent pricing visibility

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/novara-agent-counter-once.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "novara-pricing-agent-note-v2"
  cancel-in-progress: false

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Patch pricing notes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')
          marker='<!-- NOVARA_ADDITIONAL_AGENT_PRICING_V2 -->'
          if marker in t:
              raise SystemExit(0)
          s=r'''
          <!-- NOVARA_ADDITIONAL_AGENT_PRICING_V2 -->
          <style>
          .additional-agent-price-v2{display:block!important;margin:8px 0 0!important;color:#5d7467!important;font-size:14px!important;line-height:1.35!important;font-weight:600!important;letter-spacing:0!important}
          .additional-agent-price-v2 strong{color:#315746!important;font-weight:750!important}
          </style>
          <script>
          (()=>{
            const rates={'AI + Human Lite':'₹20,000/month','AI + Human Full':'₹40,000/month'};
            const apply=()=>{
              document.querySelectorAll('article, .pricing-summary').forEach(card=>{
                const h=card.querySelector('h3');
                if(!h)return;
                const title=h.textContent.replace(/\s+/g,' ').trim();
                if(!rates[title])return;
                const price=card.querySelector('.pricing-price');
                if(!price)return;
                let note=card.querySelector('.additional-agent-price-v2');
                if(!note){note=document.createElement('div');note.className='additional-agent-price-v2';price.insertAdjacentElement('afterend',note)}
                note.innerHTML='Additional agent: <strong>'+rates[title]+'</strong>';
              });
            };
            apply();
            document.addEventListener('DOMContentLoaded',apply,{once:true});
            const mo=new MutationObserver(()=>{clearTimeout(mo._t);mo._t=setTimeout(apply,25)});
            mo.observe(document.documentElement,{childList:true,subtree:true});
            setTimeout(apply,100);setTimeout(apply,500);setTimeout(apply,1500);setTimeout(apply,3000);
          })();
          </script>
          '''
          head,tail=t.rsplit('</body>',1)
          p.write_text(head+s+'\n</body>'+tail,encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Fix additional agent pricing visibility"
            git push origin main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - uses: actions/deploy-pages@v5
